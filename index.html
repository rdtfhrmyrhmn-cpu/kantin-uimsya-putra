<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Kantin Uimsya Putra</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script></head><body class="login-page"><main class="login-wrap"><section class="brand-panel"><div class="brand-symbol">☾</div><b>UIMSYA</b><h1>KANTIN<br>PUTRA</h1><p>Bersama Melayani, Berkah Mengalir</p></section><section class="login-card glass"><div class="eyebrow">KANTIN PUTRA UIMSYA</div><h2>Selamat Datang</h2><p class="muted">Masuk untuk mengelola keuangan kantin.</p><form id="loginForm"><label>Username<input id="username" autocomplete="username" required placeholder="Masukkan username"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan password"></label><button class="btn primary full">Masuk</button><div id="loginMessage" class="message"></div></form></section></main><script>loginForm.onsubmit=async e=>{e.preventDefault();loginMessage.textContent="Memproses...";const u=username.value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,""),{error}=await supabaseClient.auth.signInWithPassword({email:u+"@kantin-uimsya.local",password:password.value});if(error){loginMessage.textContent="Login gagal: "+error.message;loginMessage.className="message error";return}location.href="app.html"}</script></body></html>
