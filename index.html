<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Kantin Uimsya Putra</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script></head><body class="login"><div class="card"><h1>Kantin Uimsya Putra</h1><p>Laporan Keuangan</p><form id="loginForm"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>Masuk</button><div id="msg"></div></form></div><script>loginForm.onsubmit=async e=>{e.preventDefault();const u=username.value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');const r=await supabaseClient.auth.signInWithPassword({email:u+'@kantin-uimsya.local',password:password.value});if(r.error)msg.textContent='Login gagal: '+r.error.message;else location='app.html'}</script></body></html>
